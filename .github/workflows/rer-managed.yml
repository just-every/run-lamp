name: Managed release
on:
  workflow_dispatch:
    inputs:
      installation_id:
        description: RER installation identifier
        required: true
        type: string
      broker_url:
        description: RER management origin
        required: true
        type: string
      environment:
        description: Target environment
        required: true
        default: preview
        type: choice
        options: [preview, production]
      verification_profile:
        description: Verification scope declared by immutable project source
        required: true
        default: full
        type: choice
        options: [full]
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  release:
    uses: 'runeditrun/delivery/.github/workflows/trusted-build.yml@f50b72a5fdaaed2fac2fc615716b3f1d3c62b47a'
    with:
      installation_id: ${{ inputs.installation_id }}
      broker_url: ${{ inputs.broker_url }}
      environment: ${{ inputs.environment }}
      verification_profile: ${{ inputs.verification_profile }}
      artifact_file: 'lamp-worker-artifact.json'
      build_profile: 'project'
