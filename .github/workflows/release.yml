name: Release journeys

on:
  push:
    tags: ['v*']
  schedule:
    - cron: '23 4 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-journeys-${{ github.ref }}
  cancel-in-progress: false

jobs:
  journeys:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        journey: [upgrade, installer, readme]
    env:
      PLAYWRIGHT_SKIP_BROWSER_GC: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: package.json
      - name: Cache shared pnpm store and Chromium
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/.cache/ms-playwright
            ${{ runner.temp }}/rer-apt/archives
          key: lamp-linux-${{ runner.arch }}-${{ hashFiles('scripts/ci/bootstrap.sh', 'pnpm-lock.yaml', 'package.json') }}
      - name: Reserve disk for fresh native installations
        run: |
          free_kib() { df -Pk "$GITHUB_WORKSPACE" | awk 'END { print $4 }'; }
          for unused_tools in /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL; do
            if [ "$(free_kib)" -ge "$((20 * 1024 * 1024))" ]; then break; fi
            sudo rm -rf -- "$unused_tools"
          done
      - name: Prepare release evidence
        run: mkdir -p "$RUNNER_TEMP/lamp-release"
      - name: Install pinned tools and dependencies
        env:
          LAMP_CI_XML: 'true'
        run: nice -n 15 bash scripts/ci/bootstrap.sh 2>&1 | tee "$RUNNER_TEMP/lamp-release/bootstrap.log"
      - name: Install Chromium
        run: |
          set -euo pipefail
          pnpm exec playwright install chromium
          pnpm exec node scripts/chromium-probe.mjs || {
            sudo env "PATH=$PATH" "APT_ARCHIVES=$RUNNER_TEMP/rer-apt/archives" python3 scripts/install-chromium-deps.py
            pnpm exec node scripts/chromium-probe.mjs
          }
      - name: Upgrade from the declared previous release tag
        if: matrix.journey == 'upgrade'
        run: |
          previous=$(node --input-type=module -e 'import fs from "node:fs"; const version=JSON.parse(fs.readFileSync("RELEASE.json")).previousVersion; if (!/^\d+\.\d+\.\d+$/.test(version)) throw Error("Missing previous release version"); console.log("v"+version);')
          git rev-parse --verify "refs/tags/$previous^{commit}"
          nice -n 15 pnpm run verify:release --from "$previous" --evidence "$RUNNER_TEMP/lamp-release/upgrade" 2>&1 | tee "$RUNNER_TEMP/lamp-release/upgrade.log"
      - name: Run the actual installation journey from a fresh public clone
        if: matrix.journey != 'upgrade'
        env:
          LAMP_RELEASE_JOURNEY: ${{ matrix.journey }}
          LAMP_RELEASE_EVIDENCE: ${{ runner.temp }}/lamp-release
        run: nice -n 15 node tests/release/installation-journey.mjs
      - name: Retain journey result, screenshots and upgrade evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lamp-release-${{ matrix.journey }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lamp-release/
          if-no-files-found: error
          retention-days: 7
