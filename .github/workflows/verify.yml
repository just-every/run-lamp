name: Verify

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.reuse.outputs.skip }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: reuse
        name: Reuse only verified push evidence
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          WF_REF: ${{ github.workflow_ref }}
        run: bash scripts/ci/verify-reuse.sh
      - id: plan
        name: Read the shared local and CI verification plan
        run: node --input-type=module -e 'import { ciShardNames } from "./scripts/verification/plan.mjs"; console.log("shards=" + JSON.stringify(ciShardNames));' >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: package.json
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ~/.local/share/pnpm/store
          key: lamp-pnpm-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install pinned tools and dependencies
        run: bash scripts/ci/bootstrap.sh
      - name: Build the production Worker once
        env:
          LAMP_VERIFY_SHARD: build
          LAMP_VERIFICATION_DIRECTORY: ${{ runner.temp }}/lamp-verification/ci-shards
        run: |
          pnpm run verify:app
          tar -czf "$RUNNER_TEMP/lamp-built-worker.tar.gz" dist .wrangler/deploy/config.json
      - name: Retain commit-bound build completion
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lamp-shard-${{ github.run_id }}-${{ github.run_attempt }}-build
          path: ${{ runner.temp }}/lamp-verification/ci-shards/build.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lamp-build-${{ github.run_id }}-${{ github.sha }}
          overwrite: true
          path: ${{ runner.temp }}/lamp-built-worker.tar.gz
          if-no-files-found: error
          retention-days: 1

  shards:
    needs: [plan, build]
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      PLAYWRIGHT_SKIP_BROWSER_GC: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: package.json
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ~/.local/share/pnpm/store
          key: lamp-pnpm-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Cache Chromium and its system packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.cache/ms-playwright
            ${{ runner.temp }}/rer-apt/archives
          key: lamp-chromium-${{ runner.arch }}-${{ hashFiles('scripts/ci/bootstrap.sh', 'pnpm-lock.yaml') }}
      # Base requires 15 GiB free before starting native local servers.
      - name: Reserve disk for native runtime journeys
        if: contains(fromJSON('["ownership", "demo", "imports", "portability"]'), matrix.shard)
        run: |
          # Leave room for bootstrap without deleting every toolchain on every
          # machine. The other shards do not start a Base-managed server.
          free_kib() { df -Pk "$GITHUB_WORKSPACE" | awk 'END { print $4 }'; }
          for unused_tools in /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL; do
            if [ "$(free_kib)" -ge "$((20 * 1024 * 1024))" ]; then break; fi
            sudo rm -rf -- "$unused_tools"
          done
          df -h / "$RUNNER_TEMP"
      - name: Prepare verification logs
        run: mkdir -p "$RUNNER_TEMP/lamp-verification"
      - name: Install pinned tools and dependencies
        run: bash scripts/ci/bootstrap.sh 2>&1 | tee "$RUNNER_TEMP/lamp-verification/bootstrap.log"
      - name: Install Chromium only for browser shards
        # These shards exercise source, API and contract doors without a browser.
        if: matrix.shard != 'portability'
        run: |
          set -euo pipefail
          pnpm exec playwright install chromium
          pnpm exec node scripts/chromium-probe.mjs || {
            sudo env "PATH=$PATH" "APT_ARCHIVES=$RUNNER_TEMP/rer-apt/archives" python3 scripts/install-chromium-deps.py
            pnpm exec node scripts/chromium-probe.mjs
          }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: lamp-build-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/lamp-build
      - name: Restore the shared production Worker
        run: tar -xzf "$RUNNER_TEMP/lamp-build/lamp-built-worker.tar.gz"
      - name: Verify this product shard
        env:
          LAMP_VERIFY_SHARD: ${{ matrix.shard }}
          LAMP_VERIFICATION_DIRECTORY: ${{ runner.temp }}/lamp-verification/ci-shards
          LAMP_BASELINE_REPORT: ${{ runner.temp }}/lamp-verification/baseline-report.json
        run: |
          # rer verify adds Base's hosted-output and hydration checks after the
          # runtime shard has built and exercised the actual production Worker.
          if [ "$LAMP_VERIFY_SHARD" = runtime ]; then
            pnpm verify 2>&1 | tee "$RUNNER_TEMP/lamp-verification/shard.log"
          else
            pnpm run verify:app 2>&1 | tee "$RUNNER_TEMP/lamp-verification/shard.log"
          fi
      - name: Retain commit-bound shard completion
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lamp-shard-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/lamp-verification/ci-shards/${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain actual verification logs and browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lamp-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/lamp-verification/
            test-results/
          if-no-files-found: error
          retention-days: 7

  # Preserve the stable required-check name while requiring every planned shard.
  verify:
    needs: [plan, build, shards]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require a successful plan
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
        run: test "$PLAN_RESULT" = success
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: needs.plan.outputs.skip != 'true'
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.plan.outputs.skip != 'true'
        with:
          pattern: lamp-shard-${{ github.run_id }}-*
          path: ${{ runner.temp }}/lamp-verification/ci-shards
          merge-multiple: false
      - name: Require every planned command to succeed on this commit
        if: ${{ always() && needs.plan.outputs.skip != 'true' }}
        env:
          SHARDS_RESULT: ${{ needs.shards.result }}
          LAMP_VERIFICATION_DIRECTORY: ${{ runner.temp }}/lamp-verification/ci-shards
        run: |
          node scripts/verification/aggregate.mjs
          test "$SHARDS_RESULT" = success
      - name: Retain combined verification verdict
        if: ${{ always() && needs.plan.outputs.skip != 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lamp-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lamp-verification/ci-summary.json
          if-no-files-found: error
          retention-days: 7
